
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="theme-color"
    content="#167d72"
  >

  <meta
    name="description"
    content="صيدليتي - تطبيق تعليمي للتعرّف على الأدوية والكيسات ومتابعة التقدم."
  >

  <title>صيدليتي | Saydalati</title>

  <!-- الخطوط -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- التنسيق الأساسي -->
  <link rel="stylesheet" href="/www/style.css">

  <!-- تنسيق قسم الأدوية -->
  <link rel="stylesheet" href="/www/medicines/medicines.css">
</head>

<body>

  <div class="app-container">

    <!-- رأس التطبيق -->
    <header class="app-header">
      <div class="app-brand">
        <div class="app-logo" aria-hidden="true">💊</div>

        <div class="app-brand-text">
          <h1>صيدليتي</h1>
          <p>SAYDALATI</p>
        </div>
      </div>
    </header>

    <!-- مساحة عرض الصفحات -->
    <main id="app" class="app-content">

      <!-- الصفحة الرئيسية الافتراضية -->
      <section class="home-page" aria-labelledby="home-title">

        <div class="welcome-section">
          <p class="welcome-label">أهلاً بك في</p>
          <h2 id="home-title">صيدليتي</h2>
          <p>تعلّم، راجع، وطوّر معلوماتك الصيدلانية.</p>
        </div>

        <!-- أقسام التطبيق الأربعة -->
        <nav class="home-sections" aria-label="أقسام التطبيق">

          <button
            type="button"
            class="home-section-card"
            data-section="medicines"
          >
            <span class="section-icon" aria-hidden="true">💊</span>
            <span class="section-title">الأدوية</span>
            <span class="section-description">
              معلومات الأدوية واستخداماتها
            </span>
          </button>

          <button
            type="button"
            class="home-section-card"
            data-section="cases"
          >
            <span class="section-icon" aria-hidden="true">🩺</span>
            <span class="section-title">الكيسات</span>
            <span class="section-description">
              حالات سريرية للتعلّم والمراجعة
            </span>
          </button>

          <button
            type="button"
            class="home-section-card"
            data-section="progress"
          >
            <span class="section-icon" aria-hidden="true">📈</span>
            <span class="section-title">التقدم</span>
            <span class="section-description">
              تابع تقدّمك في التعلّم
            </span>
          </button>

          <button
            type="button"
            class="home-section-card"
            data-section="developers"
          >
            <span class="section-icon" aria-hidden="true">👨‍💻</span>
            <span class="section-title">المبرمجين</span>
            <span class="section-description">
              معلومات فريق تطوير التطبيق
            </span>
          </button>

        </nav>

      </section>

    </main>

    <!-- تذييل التطبيق -->
    <footer class="app-footer">
      <p>صيدليتي © 2026</p>
      <p>منصة تعليمية صيدلانية</p>
    </footer>

  </div>

  <!-- تشغيل التطبيق -->
  <script type="module" src="/www/app.js"></script>

</body>
</html>
